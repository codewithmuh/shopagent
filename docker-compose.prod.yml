services:
  db:
    ports: []
    restart: always

  redis:
    ports: []
    restart: always

  backend:
    volumes: []
    ports:
      - "127.0.0.1:8000:8000"
    restart: always

  frontend:
    command: sh -c "npm run build && npm start"
    volumes: []
    ports:
      - "127.0.0.1:3000:3000"
    restart: always
